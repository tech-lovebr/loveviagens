<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Entrando… — Love Viagens</title>
  <link rel="icon" type="image/png" href="/assets/fav-love.png">
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #52525B; }
    .centro { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; font-size: 0.875rem; text-align: center; padding: 1.5rem; box-sizing: border-box; }
    .spinner { width: 28px; height: 28px; border: 3px solid #E4E4E7; border-top-color: #183B54; border-radius: 50%; animation: gira 0.8s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    a { color: #183B54; }
  </style>
</head>
<body>
  <!-- Volta do login com a conta Love quando não deu para usar a janelinha
       (celular ou pop-up bloqueado): a Love manda a sessão no fragmento da
       URL; aqui gravamos no supabase-js e seguimos para o destino (?next=). -->
  <div class="centro">
    <div class="spinner" aria-hidden="true"></div>
    <p id="texto">Entrando com a conta Love…</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/supabase-init.js"></script>
  <script>
    (async () => {
      const hash = new URLSearchParams(location.hash.slice(1));
      const next = new URLSearchParams(location.search).get('next') || '/app';
      const destino = next.startsWith('/') ? next : '/app';
      const access_token = hash.get('access_token'), refresh_token = hash.get('refresh_token');
      if (access_token && refresh_token) {
        const { error } = await supabaseClient.auth.setSession({ access_token, refresh_token });
        history.replaceState(null, '', location.pathname + location.search);
        if (!error) { location.replace(destino); return; }
      }
      document.getElementById('texto').innerHTML = 'Não foi possível entrar com a conta Love. <a href="/login">Tentar de novo</a>';
    })();
  </script>
</body>
</html>
